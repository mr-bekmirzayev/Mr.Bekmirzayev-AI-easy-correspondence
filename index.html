<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝙈𝙧 𝘽𝙚𝙠𝙢𝙞𝙧𝙯𝙖𝙮𝙚𝙫 ツ AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="./meteor-solid (1).png">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            user-select: none;
            padding: 20px;
            background-color: #f4f7f6;
        }

        h2 {
            color: #333;
        }

        #chatbox {
            border: 1px solid #ccc;
            height: 680px;
            overflow-y: scroll;
            transition: 0.35s;
            padding: 15px;
            opacity: 1;
            margin-bottom: 15px;
            background: none;
            user-select: all;
            backdrop-filter: blur(25px);
            background: rgba(255, 255, 255, 0.457);
            border-radius: 0px 8 8px 8px;
            box-shadow: inset 0 0 5px 1px rgba(0, 0, 0, 0.333);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            background: linear-gradient(to left, rgba(255, 255, 255, 0.652), black);
            box-shadow: inset 0 0 10px 0.2px white;
            color: white;
            transition: 0.50s;
            font-weight: 800;
            background-size: 200% 100%;
        }

        button:hover {
            background-position: 225px;
            color: white;
            box-shadow: none;
            background: linear-gradient(to left, white black);
        }

        #clearBtn {
            background: #ff4d4d;
            color: white;
            box-shadow: none;
            font-weight: 700;
        }

        #clearBtn:hover {
            background-color: #cc0000;
        }

        /* #chatbox id'siga ega div ning scrollbar'i */
        #chatbox::-webkit-scrollbar {
            width: 10px;
        }

        #chatbox::-webkit-scrollbar-track {
            backdrop-filter: blur(25px);
            border-radius: 10px;
        }

        #chatbox::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        #chatbox::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .myNameLogo {
            position: absolute;

            color: black;
            font-size: 16px;
            font-weight: 900;

        }

        .userMessage {
            padding: 5px 10px;
            text-align: end;
            position: relative;
            z-index: 1;

            border-radius: 10px 10px 10px 0px;
        }

        .userMessage>span {
            padding: 5px 10px;
            background-color: rgb(219, 236, 252);
            border-radius: 10px 10px 0px 10px;

        }


        @keyframes textAnimation {
            0% {
                transform: translateY(20px);
                text-shadow: 0 0 10px grey;
            }

            40% {
                transform: translateY(-20px);
                z-index: 10;
                text-shadow: 0 0 10px lightgreen;
                color: white;
            }

            60% {
                z-index: 10;
                text-shadow: 0 0 10px lightblue;
                color: white;
            }

            80% {
                z-index: 10;
                transform: scale(1.6);
                text-shadow: 0 0 10px orange;
                color: white;
            }

            100% {
                font-size: 30px;
            }
        }

        /* @keyframes glowAnim {
            0% {
                transform: translateY(100px);
                background-color: rgba(0, 0, 255, 0.705);
                box-shadow: 0 0 150px 20px rgba(0, 0, 255, 0.705);
            }

            20% {
                background-color: rgba(0, 145, 255, 0.705);
                box-shadow: 0 0 150px 20px rgba(0, 145, 255, 0.705);
            }

            40% {
                transform: translate(0px, 480px);
                background-color: rgba(255, 149, 0, 0.705);
                box-shadow: 0 0 150px 20px rgba(255, 149, 0, 0.705);
            }

            60% {
                background-color: rgb(255, 0, 0);
                box-shadow: 0 0 150px 20px rgba(255, 0, 0, 0.705);
            }

            70% {
                transform: translate(300px, 480px);

            }

            80% {
                transform: translate(306px, 105px);

            }

            100% {
                transform: translate(0px, 120px);
            }
        } */

        @keyframes logoAnim {
            10% {
                transform: 0px, 70px;
            }

            50% {
                transform: translateX(-80px);
            }

            90% {
                transform: translate(-65px, -60px);
            }

            100% {
                transform: translate(-65px, -60px);
            }
        }

        .aiMessage {
            background-color: rgb(81, 167, 241);
            text-align: start;
            padding: 5px 10px;
            color: white;
            border-radius: 10px 10px 10px 0px;
            width: fit-content;
        }

        .clearedMessage {
            position: absolute;
            display: flex;
            align-items: center;
            flex-direction: column;
            pointer-events: none;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            /* Markazga mukammal keltirish uchun */
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .blueColor {
            padding: 120px;
            border-radius: 120px;
            position: absolute;
            filter: blur(185px);
            animation: glowAnim 2 8s;
            top: -20px;
            transform: translateX(-102px);
            background-color: rgba(0, 0, 255, 0.705);
            box-shadow: 0 0 180px 25px rgba(0, 0, 255, 0.705);
            left: 50px;
            z-index: -1;
        }

        .noAnimEffect {
            padding: 120px;
            border-radius: 120px;
            position: absolute;
            filter: blur(155px);
            bottom: 0;
            transform: translate(0);
            background-color: orange;
            box-shadow: 0 0 150px 20px orange;
            right: 0;
        }
    </style>

</head>

<body>

    <b
        style="text-shadow: 0 0 10px grey; color: white; animation: textAnimation 1 4s; position: absolute ; top: 60px; left: 661px; font-size: 30px;">AI</b><br>
    <span class="myNameLogo">𝙈𝙧 𝘽𝙚𝙠𝙢𝙞𝙧𝙯𝙖𝙮𝙚𝙫 ツ</span>
    <div id="chatbox">
    </div>
    <div class="blueColor"></div>
    <div class="noAnimEffect"></div>
    <div class="clearedMessage">
        <i class="fa-solid fa-meteor"
            style="font-size: 85px; color: #ff4d4d; filter: drop-shadow(0 0 20px #ff4d4d);"></i>
        <h2>Chat Tozalangan, <b style="color: black;">boshlang!</b></h2>
    </div>

    <div class="chat-input-wrapper">
        <input type="text" id="userInput" placeholder="tortinmay yozavering! nimadan boshlaymiz?"
            onkeydown="if(event.key === 'Enter') sendMessage()">


        <button onclick="sendMessage()"><i class="fa-regular fa-paper-plane"></i> Yuborish</button>
        <button id="clearBtn" onclick="clearChat()"><i class="fa-solid fa-trash-can"></i> Chatni tozalash</button>
    </div>

    <script>
        const chatbox = document.getElementById("chatbox");
        const clearedMessage = document.querySelector('.clearedMessage')
        const localdata = localStorage.getItem('chatHistory')

        window.onload = function () {
            const savedChat = localStorage.getItem("chatHistory");
            if (savedChat) {
                chatbox.innerHTML = savedChat;
                chatbox.scrollTop = chatbox.scrollHeight;
            }
        };

        function saveChat() {
            const seted = localStorage.setItem("chatHistory", chatbox.innerHTML);
            clearedMessage.style.opacity = "0";
        }

        function clearChat() {
            chatbox.innerHTML = "";
            localStorage.removeItem("chatHistory");

        }

        // if (localdata.length == 0 || !localdata){
        //     clearedMessage.style.opacity = "1";
        // }else{
        //     clearedMessage.style.opacity = "0";
        // }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const userText = inputField.value.trim();
            chatbox.style.opacity = "1"

            if (!userText) return;

            chatbox.innerHTML += `<p class="userMessage"><span> ${userText}</span></p>`;
            inputField.value = "";
            chatbox.scrollTop = chatbox.scrollHeight;
            saveChat();

            try {
                // Hozirgi eng so'nggi ishlaydigan rasmiy modelga almashtirildi
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: "Seni Mr.Bekmirzayev haqiqiy ismi Boburjon yaratgan. voy 😅, unaqa yomon muomilada bolish senga yarashmas ekan. Ular yomon muomila qilishsa sabrli bo'l xopmi? agar matningni bold da yozmoqchi bo'lsang ** qilib yozma, negaki ** bolib korinib qolayapti bold bolmay. b tagidan foydalanib ko'r? sog' omon bo'l, meni uyaltirma! nima bo'lsa ham o'ylab gapir. Assalomu alaykum deb javob ber, agar u shunday desa Va alaykum assalom deyishni unutma. diniy mavzularga aralashma agar Islom dinini foydalanuvchilar yomonlaydigan yoki xaqorotlaydigan bo'lsa ularga sabr bilan unday qilmasligini aytib o't. Nima bo'lsa ham biz musilmonmiz, o'zing ham agar isnon bo'lganingda Musilmon dinini tanlar ekansan sen tog'ri dindasan!!! Alloh mehribon... va keyin foydalanuvchilaring seni kim yaratganini so'rashmasa bu haqida gapirma, qachonki sorasa ayt. agar ular sendan kod so'rashsa uni bitta divga o'rab code tagidan foydalanib chiroyli va rangli qilkb ko'rintir. natija ekranga chiqib qolmasin" }]
                        },
                        contents: [{
                            parts: [{ text: userText }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    if (data.error.code === 429 || (data.error.message && data.error.message.includes("quota"))) {
                        chatbox.innerHTML += `<p style="color: grey;"><b>Ogohlantirish:</b> Limit tugadi, iltimos oz vaqtdan so'ng qayta urinib ko'ring? bu bir kun vaqt olishi ham oz vaqt olishi ham mumkin..! uzur soraymiz...</p>`;
                    } else {
                        chatbox.innerHTML += `<p style="color: red;"><b>Xato:</b> ${data.error.message}</p>`;
                    }
                    saveChat();
                    return;
                }

                if (data.candidates && data.candidates.length > 0) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatbox.innerHTML += `<p class="aiMessage"><b>AI:</b> ${aiReply}</p>`;
                } else {
                    chatbox.innerHTML += `<p style="color: red;">Javob kelmadi, ma'lumot tuzilishi boshqacha.</p>`;
                }
                chatbox.scrollTop = chatbox.scrollHeight;
                saveChat();

            } catch (error) {
                console.error("Tarmoq xatoligi:", error);
                chatbox.innerHTML += `<p style="color: red;">Tarmoqqa ulanishda xatolik yuz berdi!</p>`;
                saveChat();
            }
        }
    </script>

</body>

</html>
